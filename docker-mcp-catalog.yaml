name: asin
image: mcp/asin
type: server
meta:
  category: data
  tags:
    - asin
    - amazon-api
    - price-tracking
    - price-history
    - asin
about:
  title: Asin
  description: Track Amazon prices and products with a scheduled watchlist, price history, offers and alerts.
  icon: https://raw.githubusercontent.com/asindotdev/asin-mcp/main/assets/icon-400.png
source:
  project: https://github.com/asindotdev/asin-mcp
run:
  allowHosts:
    - www.asin.dev/api/v1:443
config:
  description: Configure your Asin API key.
  secrets:
    - name: asin.api_key
      env: ASIN_API_KEY
      example: YOUR_API_KEY
      description: Required API key from https://www.asin.dev/app.
      required: true
